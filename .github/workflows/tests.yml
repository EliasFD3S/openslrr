name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure workspace
        run: |
          & ./scripts/Initialize-SlrrWorkspace.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check native coverage drift
        run: python scripts/render_native_coverage.py --check

      - name: Build tests
        run: |
          $cmake = Join-Path $env:GITHUB_WORKSPACE 'tools/cmake-3.31.8-windows-x86_64/bin/cmake.exe'
          & $cmake --build --preset windows-x64-release --target slrr_host slrr_tests --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        run: |
          $ctest = Join-Path $env:GITHUB_WORKSPACE 'tools/cmake-3.31.8-windows-x86_64/bin/ctest.exe'
          & $ctest --test-dir build-bgfx-x64 -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run headless diagnostics
        run: |
          $hostExe = Join-Path $env:GITHUB_WORKSPACE 'build-bgfx-x64/Release/slrr_host.exe'
          $diag = Join-Path $env:GITHUB_WORKSPACE 'artifacts/normal'
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          & $hostExe --probe-physics --physics-telemetry "$diag/physics.jsonl" --log-all "$diag/physics-log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $hostExe --compare-physics-replay "$diag/physics.jsonl" "$diag/physics.jsonl" --physics-compare-report "$diag/physics-compare.json" --log-all "$diag/replay-log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $hostExe --probe-dyno --log-all "$diag/dyno-log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $hostExe --probe-gc --log-all "$diag/gc-log" --native-report "$diag/gc-log/native-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload normal-lane success diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-diagnostics
          if-no-files-found: ignore
          path: |
            artifacts/normal/**
            build-bgfx-x64/Testing/Temporary/LastTest.log

      - name: Upload normal-lane failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-failure-diagnostics
          if-no-files-found: ignore
          path: |
            build-bgfx-x64/**/fuzz-repro*/**
            build-bgfx-x64/Testing/Temporary/**
            artifacts/normal/**


  windows-asan:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure workspace
        run: |
          & ./scripts/Initialize-SlrrWorkspace.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure ASan build
        run: |
          $cmake = Join-Path $env:GITHUB_WORKSPACE 'tools/cmake-3.31.8-windows-x86_64/bin/cmake.exe'
          & $cmake -S . -B build-asan -G 'Visual Studio 17 2022' -A x64 -DSLRR_ENABLE_ASAN=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build ASan tests
        run: |
          $cmake = Join-Path $env:GITHUB_WORKSPACE 'tools/cmake-3.31.8-windows-x86_64/bin/cmake.exe'
          & $cmake --build build-asan --config Release --target slrr_host slrr_tests --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add ASan runtime to PATH
        run: |
          # The instrumented executables load the MSVC ASan runtime DLL from the
          # toolset bin directory CMake selected; the runner does not put it on PATH.
          $cache = Join-Path $env:GITHUB_WORKSPACE 'build-asan/CMakeCache.txt'
          $match = Select-String -Path $cache -Pattern '^CMAKE_LINKER:FILEPATH=(.+)$' | Select-Object -First 1
          if (-not $match) { throw 'CMAKE_LINKER not found in build-asan/CMakeCache.txt' }
          $dir = Split-Path -Parent $match.Matches[0].Groups[1].Value
          if (-not (Test-Path (Join-Path $dir 'clang_rt.asan_dynamic-x86_64.dll'))) {
            throw "MSVC ASan runtime not found in $dir"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Run ASan tests
        run: |
          $env:ASAN_OPTIONS = 'abort_on_error=1:symbolize=0'
          $ctest = Join-Path $env:GITHUB_WORKSPACE 'tools/cmake-3.31.8-windows-x86_64/bin/ctest.exe'
          & $ctest --test-dir build-asan -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run ASan headless diagnostics
        run: |
          $env:ASAN_OPTIONS = 'abort_on_error=1:symbolize=0'
          $hostExe = Join-Path $env:GITHUB_WORKSPACE 'build-asan/Release/slrr_host.exe'
          $diag = Join-Path $env:GITHUB_WORKSPACE 'artifacts/asan'
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          & $hostExe --probe-physics --physics-telemetry "$diag/physics.jsonl" --log-all "$diag/physics-log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $hostExe --compare-physics-replay "$diag/physics.jsonl" "$diag/physics.jsonl" --physics-compare-report "$diag/physics-compare.json" --log-all "$diag/replay-log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $hostExe --probe-dyno --log-all "$diag/dyno-log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $hostExe --probe-gc --log-all "$diag/gc-log" --native-report "$diag/gc-log/native-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload ASan success diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-asan-test-diagnostics
          if-no-files-found: ignore
          path: |
            artifacts/asan/**
            build-asan/Testing/Temporary/LastTest.log

      - name: Upload ASan failure reproducers and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-asan-failure-diagnostics
          if-no-files-found: ignore
          path: |
            build-asan/**/fuzz-repro*/**
            build-asan/Testing/Temporary/**
            artifacts/asan/**
